# Central configuration for the AFL prediction model.
# Values here are the tunable knobs referenced throughout src/afl_model —
# nothing rating- or threshold-related should be hardcoded in code.

database:
  path: "data/afl.db"

data:
  # Earliest season ingested. Chosen deliberately: earlier AFL Tables data
  # is real but stats coverage is inconsistent before this point, and the
  # project's scope has been set to the 2018 season onward.
  earliest_season: 2018

  squiggle:
    base_url: "https://api.squiggle.com.au/"
    # Squiggle asks API consumers to identify themselves and to send no
    # more than one request per second. contact_email is left unset here
    # deliberately — set it in config.local.yaml (gitignored) rather than
    # committing personal contact info to a public repo.
    min_request_interval_seconds: 1.1
    contact_email: null

  afltables:
    # No public API — this is a personal site scraped politely: a longer
    # gap between requests than Squiggle's, plus aggressive local caching
    # (raw_cache_dir) so completed seasons are only ever fetched once.
    min_request_interval_seconds: 2.5
    user_agent: "afl-model/0.1 (personal AFL prediction project, non-commercial, low request rate)"
    raw_cache_dir: "data/raw/afltables"

logging:
  config_path: "config/logging.yaml"

# Rating engine parameters. elo.k_factor, home_ground_advantage,
# season_regression_factor, attack_defence.k_factor, and
# league_avg_score_ewma_alpha were frozen by Stage 7's systematic grid
# search (afl-model tune) — a 252 x 180 combination search for the
# win-probability group (scored by log loss) and a 20-combination search
# for the margin group (scored by MAE), both scored on the 2019-2024
# validation seasons only. mov_multiplier_divisor/scale and starting_rating/
# season_regression_target were deliberately left un-searched — see
# afl_model.tuning.grid for why. Re-run afl-model tune (not by hand) if
# more data or a materially different model warrants revisiting these.
ratings:
  elo:
    starting_rating: 1500.0
    k_factor: 15.0
    # Margin-of-victory multiplier (FiveThirtyEight NFL/NBA Elo style):
    # mov_multiplier = ln(|margin| + 1) * (mov_multiplier_divisor /
    #   (elo_diff_of_winner * mov_multiplier_scale + mov_multiplier_divisor))
    # Amplifies upsets, damps expected blowouts, so a big win by a big
    # favorite doesn't swing ratings as much as the same margin would for
    # an underdog.
    mov_multiplier_divisor: 2.2
    mov_multiplier_scale: 0.001
    # Elo points added to the home team's rating for win-probability
    # purposes only (not stored as a separate per-team rating in v1 — see
    # Stage 4 write-up for why team/venue-specific HGA was deferred).
    # Unchanged by the Stage 7 search — 35.0 was already the validated best.
    home_ground_advantage: 35.0
    # Applied once, the first time a team appears in a new season: pulls
    # the rating partway back toward season_regression_target, since a
    # team's true strength between seasons (list changes, etc.) regresses
    # toward the mean more than in-season form does.
    season_regression_factor: 0.65
    season_regression_target: 1500.0

  attack_defence:
    # Operates in points-space, so needs its own (much smaller) k_factor
    # than Elo's win/loss-space k_factor.
    k_factor: 0.05
    starting_league_avg_score: 85.0
    # League-average scoring drifts across eras (rule changes, congestion)
    # — tracked as a slow-moving EWMA rather than a fixed constant.
    league_avg_score_ewma_alpha: 0.01

  form:
    # Higher alpha than Elo's effective memory — form is deliberately a
    # more reactive, shorter-memory signal than the slow-moving Elo rating,
    # meant to capture hot/cold streaks Elo alone would smooth over.
    ewma_alpha: 0.25

  adjustments:
    rest:
      # rest_adjustment is stored as signed days relative to this baseline
      # (positive = more rest than normal, negative = short turnaround) —
      # a raw, unscaled fact. How much it should matter to a prediction is
      # a Stage 5 decision, not baked in here.
      baseline_days: 6
    travel:
      # travel_adjustment is stored as straight-line km from a team's home
      # city to the venue (haversine, city-level — not exact stadium
      # coordinates). Left null when either city isn't in the reference
      # data rather than guessed.
      enabled: true

# Prediction engine: how the individual rating signals (Stage 4) combine
# into a single win probability, margin, and total. Margin/total come
# purely from attack/defence ratings in v1 — extending situational
# adjustments to points-space too is a natural follow-up once a future
# search shows it would help.
prediction:
  # rest_elo_scale_per_day and travel_elo_scale_per_100km were frozen by the
  # Stage 7 grid search (afl-model tune), scored jointly with
  # elo.k_factor/home_ground_advantage/season_regression_factor by log loss
  # on the 2019-2024 validation seasons. rest_elo_scale_per_day converged
  # to 0 independently of the earlier Stage 5 ablation — two different
  # methods now agree it has no measurable value in this dataset.
  #
  # form_elo_scale is deliberately 0, NOT the search's own top result: the
  # grid search's nominal winner was 10.0, but its margin over 0 was
  # razor-thin (log loss identical to 4 decimal places between form=0 and
  # form=10 — indistinguishable from noise at this sample size, not a real
  # effect). Stage 5's independent ablation study had already found 0 to
  # be the more defensible value. Given two methods produced a genuine tie
  # rather than two methods agreeing on a nonzero weight, 0 was kept as
  # the simpler, more parsimonious choice — deliberately rejecting the
  # search's nominal top result rather than retaining an effect that may
  # well be noise. This was a judgment call made *without* looking at the
  # 2025-2026 held-out test period to decide between them — using the
  # holdout to pick a value would have defeated the point of holding it
  # out at all.
  form_elo_scale: 0.0
  rest_elo_scale_per_day: 0.0
  travel_elo_scale_per_100km: 2.5
  # Predicted margin is rounded to this increment for predicted_line,
  # matching standard AFL handicap-betting convention (lines are set in
  # half-point increments so a match can't push/tie against the line).
  # predicted_margin itself stays an unrounded float.
  line_rounding: 0.5
  # A team's rating is treated as "mature" (full confidence) once this
  # many of their matches have been processed by the ratings engine —
  # below that, confidence is scaled down since the rating is still
  # largely at (or close to) its starting value. ~1 home-and-away season.
  confidence_maturity_games: 22

betting:
  odds_source: null # decided at Stage 6
  min_edge_threshold: null # derived from backtest calibration, not guessed
